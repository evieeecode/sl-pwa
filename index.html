<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#dff2ff" />
  <meta name="description" content="申论标题与分论点八股限时操练，本地优先、离线可用。" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="八股操练" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
  <title>申论八股操练</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand">八股操练</div>
      <div id="topStats" class="top-stats" hidden>
        <span class="heart-pill" id="heartPill">❤ 3</span>
        <span class="xp-pill" id="xpPill">XP 0</span>
        <span class="combo-pill" id="comboPill">🔥 0</span>
      </div>
    </header>

    <main id="main" class="main-content"></main>

    <nav class="bottom-nav" aria-label="主导航">
      <button class="nav-btn active" data-page="today" aria-label="首页" title="首页"><img src="icons/home.svg" alt="" aria-hidden="true"></button>
      <button class="nav-btn" data-page="practice" aria-label="练习" title="练习"><img src="icons/practice.svg" alt="" aria-hidden="true"></button>
      <button class="nav-btn" data-page="corpus" aria-label="语料库" title="语料库"><img src="icons/library.svg" alt="" aria-hidden="true"></button>
      <button class="nav-btn" data-page="stats" aria-label="统计" title="统计"><img src="icons/statistics.svg" alt="" aria-hidden="true"></button>
      <button class="nav-btn" data-page="settings" aria-label="设置" title="设置"><img src="icons/setting.svg" alt="" aria-hidden="true"></button>
    </nav>
  </div>

  <div id="modalRoot" class="modal-root" hidden></div>
  <input id="importFile" type="file" accept="application/json,.json" hidden />

  <script src="app.js"></script>
</body>
</html>
